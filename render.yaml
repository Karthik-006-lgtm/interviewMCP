services:
  # Backend Service
  - type: web
    name: hiresense-backend
    env: java
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: DB_URL
        value: jdbc:h2:mem:testdb
      - key: DB_USERNAME
        value: sa
      - key: DB_PASSWORD
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: AI_SERVICE_BASE_URL
        fromService:
          name: hiresense-ai
          type: web
          property: host
      - key: FRONTEND_ORIGIN
        fromService:
          name: hiresense-frontend
          type: web
          property: host
      - key: APP_BOOTSTRAP_ADMIN_EMAIL
        value: admin@hiresense.ai
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        value: admin123
      - key: APP_BOOTSTRAP_ADMIN_FULL_NAME
        value: Platform Admin
      - key: RESUME_STORAGE_DIR
        value: /opt/render/project/uploads/resumes
      - key: AUDIO_STORAGE_DIR
        value: /opt/render/project/uploads/audio
      - key: RECORDING_STORAGE_DIR
        value: /opt/render/project/uploads/recordings

  # AI Service
  - type: web
    name: hiresense-ai
    env: python
    region: oregon
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000

  # Frontend Service
  - type: web
    name: hiresense-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: hiresense-backend
          type: web
          property: host
