version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:h2:mem:testdb
      - DB_USERNAME=sa
      - DB_PASSWORD=
      - JWT_SECRET=ZmFrZV9kZXZfb25seV9zZWNyZXRfZmFrZV9kZXZfb25seV9zZWNyZXRfZmFrZQ==
      - JWT_EXPIRATION_MS=86400000
      - AI_SERVICE_BASE_URL=http://ai-service:8000
      - RESUME_STORAGE_DIR=/app/uploads/resumes
      - AUDIO_STORAGE_DIR=/app/uploads/audio
      - RECORDING_STORAGE_DIR=/app/uploads/recordings
      - FRONTEND_ORIGIN=http://localhost:5173
      - APP_BOOTSTRAP_ADMIN_EMAIL=admin@hiresense.ai
      - APP_BOOTSTRAP_ADMIN_PASSWORD=admin123
      - APP_BOOTSTRAP_ADMIN_FULL_NAME=Platform Admin
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - app-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend
      - ai-service
    networks:
      - app-network

volumes:
  backend-uploads:

networks:
  app-network:
    driver: bridge
