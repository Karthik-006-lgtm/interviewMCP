spring.application.name=interview-prep-platform
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info

app.jwt.secret=${JWT_SECRET:ZmFrZV9kZXZfb25seV9zZWNyZXRfZmFrZV9kZXZfb25seV9zZWNyZXRfZmFrZQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
app.storage.resume-dir=${RESUME_STORAGE_DIR:./uploads/resumes}
app.storage.audio-dir=${AUDIO_STORAGE_DIR:./uploads/audio}
app.storage.recording-dir=${RECORDING_STORAGE_DIR:./uploads/recordings}
app.mcp.tools-dir=${APP_MCP_TOOLS_DIR:../mcp-tools}
app.mcp.workspace-root=${APP_MCP_WORKSPACE_ROOT:..}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${APP_BOOTSTRAP_ADMIN_FULL_NAME:Platform Admin}

logging.level.com.interviewprep.platform=${APP_LOG_LEVEL:INFO}
